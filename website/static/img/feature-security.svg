<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200">
  <!-- OTA Update/Security illustration -->
  <defs>
    <linearGradient id="secureGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#45a049;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="300" height="200" fill="#f5f5f5" rx="10"/>
  
  <!-- Shield shape for security -->
  <path d="M 150 40 L 190 55 L 190 100 Q 190 130 150 150 Q 110 130 110 100 L 110 55 Z" 
        fill="url(#secureGrad)" stroke="#368a3d" stroke-width="3"/>
  
  <!-- Lock icon inside shield -->
  <rect x="140" y="85" width="20" height="25" fill="white" rx="2"/>
  <circle cx="150" cy="80" r="8" fill="none" stroke="white" stroke-width="3"/>
  <circle cx="150" cy="95" r="3" fill="#4CAF50"/>
  
  <!-- Download/Update arrow -->
  <path d="M 150 110 L 150 130 M 145 125 L 150 130 L 155 125" 
        stroke="white" stroke-width="3" stroke-linecap="round" fill="none"/>
  
  <!-- Signal waves for OTA -->
  <path d="M 120 60 Q 115 65 120 70" stroke="#4CAF50" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M 110 55 Q 100 65 110 75" stroke="#4CAF50" stroke-width="2" fill="none" opacity="0.4"/>
  <path d="M 180 60 Q 185 65 180 70" stroke="#4CAF50" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M 190 55 Q 200 65 190 75" stroke="#4CAF50" stroke-width="2" fill="none" opacity="0.4"/>
</svg>
