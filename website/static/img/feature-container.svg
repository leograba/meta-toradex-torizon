<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200">
  <!-- Container/Box illustration -->
  <defs>
    <linearGradient id="containerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#45a049;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="300" height="200" fill="#f5f5f5" rx="10"/>
  
  <!-- Container box -->
  <rect x="75" y="50" width="150" height="100" fill="url(#containerGrad)" rx="5"/>
  <rect x="80" y="55" width="140" height="20" fill="rgba(255,255,255,0.3)" rx="3"/>
  <rect x="80" y="80" width="140" height="65" fill="rgba(255,255,255,0.2)" rx="3"/>
  
  <!-- Docker-style icon elements -->
  <rect x="95" y="90" width="30" height="20" fill="white" opacity="0.9" rx="2"/>
  <rect x="130" y="90" width="30" height="20" fill="white" opacity="0.9" rx="2"/>
  <rect x="165" y="90" width="30" height="20" fill="white" opacity="0.9" rx="2"/>
  <rect x="95" y="115" width="30" height="20" fill="white" opacity="0.9" rx="2"/>
  <rect x="130" y="115" width="30" height="20" fill="white" opacity="0.9" rx="2"/>
  
  <!-- Small Torizon logo on container -->
  <rect x="85" y="60" width="15" height="15" fill="#368a3d" rx="2"/>
  <path d="M 87 65 L 98 65 L 98 67 L 94.5 67 L 94.5 73 L 90.5 73 L 90.5 67 L 87 67 Z" fill="white"/>
</svg>
